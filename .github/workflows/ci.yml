name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".github/*.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".github/*.md"
      - "LICENSE"
  schedule:
    # Weekly build verification (Sundays at midnight UTC)
    - cron: "0 0 * * 0"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  # sccache configuration for faster Rust builds
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  # Commit message linting (PR only)
  commitlint:
    name: Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate PR commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # Frontend checks
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Check Press design-system mirrors
        run: npm run check:design-system

      - name: Type check
        run: npm run check

      # Dependency auditing deliberately lives in security.yml, not here.
      # This job is a required status check on main, so a fresh advisory in a
      # transitive dev dependency would otherwise block every merge and every
      # release — and, because the audit ran before the tests, silently skip
      # the test suite while doing it. See security.yml for the audit.
      - name: Test with coverage
        run: npm test -- --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 7

  # Rust checks
  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # See the note in the Frontend job: auditing lives in security.yml.
      - name: Test
        run: cargo test --all-features

  # Does this PR touch the build plumbing itself?
  #
  # The Build job below is expensive (three platforms), so it normally only runs
  # on pushes to main and on the weekly schedule. That left one blind spot: a
  # change to the build command or the Tauri config could not be verified before
  # merging, and a Windows-only quoting bug shipped through exactly that gap.
  # When a PR edits this workflow or the Tauri config, build it properly.
  plumbing:
    name: Detect build-plumbing changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "changed files:"
          echo "$files"
          if echo "$files" | grep -qE '^(\.github/workflows/|src-tauri/tauri\..*\.json|src-tauri/Cargo\.(toml|lock)|package(-lock)?\.json)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "-> build plumbing touched; the Build job will run"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "-> no build plumbing touched; the Build job will be skipped"
          fi

  # Build check (ensures the full app can build)
  # Runs on pushes to main, on the schedule, and on PRs that touch the build
  # plumbing (see the plumbing job above).
  build:
    name: Build
    needs: [frontend, rust, plumbing]
    if: |
      always()
      && needs.frontend.result == 'success'
      && needs.rust.result == 'success'
      && (github.event_name != 'pull_request'
          || needs.plumbing.outputs.changed == 'true')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      # Build-verification only; updater signing happens in release.yml.
      # Disable updater artifacts so the build doesn't require a signing key.
      # The updater artifacts are skipped here because signing them needs
      # TAURI_SIGNING_PRIVATE_KEY, which this job has no business holding — the
      # release workflow does that. Passed as a config *file* rather than inline
      # JSON on purpose: the inline form lost its quotes to pwsh on the Windows
      # runner and failed with "key must be a string".
      - name: Build
        run: npm run tauri build -- --target ${{ matrix.target }} --config src-tauri/tauri.build-check.conf.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/
          retention-days: 7
          if-no-files-found: ignore
