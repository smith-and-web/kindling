name: Release Build

# Rehearses the release matrix (universal macOS, ubuntu-22.04 bundles, Windows
# MSI/NSIS) before a tag is pushed. release.yml is the only other place these
# bundles are built, so without this a bundling break surfaces at tag time.
# Artifacts are unsigned and have no updater signatures; nothing is published.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/build.rs"
      - "src-tauri/capabilities/**"
      - "src-tauri/icons/**"
      - "src-tauri/*.plist"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-build.yml"
  schedule:
    # Weekly, so drift in runners or toolchains shows up between releases.
    - cron: "0 3 * * 0"

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Bundle (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            args: "--target universal-apple-darwin -- --no-default-features"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "-- --no-default-features"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "-- --no-default-features"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # Updater artifacts need the signing key, which PRs don't get.
      - name: Build bundles
        timeout-minutes: 60
        shell: bash
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}' ${{ matrix.args }}

      - name: List bundles
        shell: bash
        run: find src-tauri/target -maxdepth 6 -path '*/release/bundle/*' -type f | sort

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.target }}
          path: src-tauri/target/**/release/bundle/
          retention-days: 7
